  - { id: cba.credit_to_gdp, label_en: "Loans to the economy / trailing-four-quarter nominal GDP", formula: ratio_quarter_aligned, numerator: cba.loans.total_ci, denominator: ssc.gdp.trailing4q_nominal, scale: 100, unit: "%", basis: "quarter-end loan stock over the trailing 4-quarter nominal GDP ending in that quarter" }
