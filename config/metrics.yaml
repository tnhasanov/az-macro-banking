  - { id: ssc.gdp.sector.trade.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.trade.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.transport.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.transport.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.manufacturing.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.manufacturing.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.mining.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.mining.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.industry.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.industry.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.ict.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.ict.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.accommodation.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.accommodation.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.total.real_growth_ytd, formula: index_to_growth, input: ssc.gdp.sector.total.real_index_ytd, unit: "%" }
  - { id: ssc.gdp.sector.agriculture.share_nominal, formula: share, numerators: [ssc.gdp.sector.agriculture.nominal_ytd], denominator: ssc.gdp.sector.total.nominal_ytd, unit: "%" }
  - { id: ssc.gdp.sector.construction.share_nominal, formula: share, numerators: [ssc.gdp.sector.construction.nominal_ytd], denominator: ssc.gdp.sector.total.nominal_ytd, unit: "%" }
  - { id: ssc.gdp.sector.trade.share_nominal, formula: share, numerators: [ssc.gdp.sector.trade.nominal_ytd], denominator: ssc.gdp.sector.total.nominal_ytd, unit: "%" }
  - { id: ssc.gdp.sector.transport.share_nominal, formula: share, numerators: [ssc.gdp.sector.transport.nominal_ytd], denominator: ssc.gdp.sector.total.nominal_ytd, unit: "%" }
  - { id: ssc.gdp.sector.industry.share_nominal, formula: share, numerators: [ssc.gdp.sector.industry.nominal_ytd], denominator: ssc.gdp.sector.total.nominal_ytd, unit: "%" }
  - { id: ssc.gdp.nonoil_share_nominal, label_en: "Non-oil-gas share of GDP (nominal, YTD)", formula: share, numerators: [ssc.hl.gdp_nonoil.level], denominator: ssc.hl.gdp.level, unit: "%" }
