# Who receives a report, over which channel, and how the message is put together.
#
# No credential, token, address or phone number belongs in this file. Recipients are named here by
# role and their actual addresses come from the environment, so this file is safe to commit and a
# change of recipient is a change of environment, not a change of code.
#
# Delivery is off until `enabled: true` and the provider's environment variables are present. With
# either missing, a run composes the message, records the intent and reports "not sent - disabled",
# so the whole path is exercisable before any account exists.

enabled: false

# Everything goes to the owner while the system is in draft. Add recipients here when the content
# has been reviewed; each one is a separate delivery record, so one failure never blocks another.
distribution_lists:
  draft:
    description: "Owner only, while the reports are being reviewed"
    recipients:
      - id: owner
        role: owner
        channels: [email]
        # The address is read from this environment variable. Nothing is defaulted: with the
        # variable unset the recipient is skipped and the run says so.
        email_env: AZMONITOR_OWNER_EMAIL
        # WhatsApp needs an explicit opt-in recorded here as well as a number in the environment.
        # Both must be present; an opted-in flag alone sends nothing.
        whatsapp_env: AZMONITOR_OWNER_WHATSAPP
        whatsapp_opted_in: false
        whatsapp_opt_in_recorded_at: null      # ISO date the recipient agreed, for the audit trail

  # Example of the list to switch to after review. Not used until a report names it.
  management_board:
    description: "Management Board, CRO and ALCO - not in use yet"
    recipients: []

# Which list receives which report. Every report is on the draft list for now.
routing:
  monthly:         {list: draft, subject: "Azerbaijan Macro & Banking Monitor - {edition}"}
  weekly:          {list: draft, subject: "Weekly release digest - week of {window_start}"}
  sector:          {list: draft, subject: "Sector review: {sector} - {edition}"}
  mpr_brief:       {list: draft, subject: "CBA Monetary Policy Review {edition} - brief"}
  fsr_brief:       {list: draft, subject: "CBA Financial Stability Report {edition} - brief"}
  decision_update: {list: draft, subject: "CBA policy decision {edition}"}
  alert:           {list: draft, subject: "[azmonitor] {severity}: {headline}"}

channels:

  email:
    enabled: false
    provider: microsoft_graph
    # The mailbox the message is sent from. Must be a mailbox the app registration may send as.
    sender_env: AZMONITOR_GRAPH_SENDER
    microsoft_graph:
      tenant_id_env: AZMONITOR_GRAPH_TENANT_ID
      client_id_env: AZMONITOR_GRAPH_CLIENT_ID
      client_secret_env: AZMONITOR_GRAPH_CLIENT_SECRET
      # Client-credentials flow against the application permission Mail.Send.
      scope: "https://graph.microsoft.com/.default"
      authority: "https://login.microsoftonline.com"
      endpoint: "https://graph.microsoft.com/v1.0"
      # Graph rejects a message over roughly 4 MB sent this way. A larger deck is linked instead of
      # attached and the message says so rather than failing.
      max_attachment_mb: 3.5
      timeout_seconds: 60
    message:
      # The executive summary is taken from the report's own validated findings. Nothing new is
      # written at delivery time: a sentence that was not grounded in the deck is not in the email.
      summary_findings: 5
      include_quality_note: true       # name any data-quality exception that touched the edition
      include_links: true              # link the artifacts that are not attached
      attach: main_pdf                 # main_pdf | none
      footer: "Generated by the Azerbaijan Macro & Banking Monitor from official CBA and SSC publications. Draft for internal review."

  whatsapp:
    # Off until an official provider account exists and templates are approved. A WhatsApp message
    # is a notification that a report is ready, never the report itself: no figures are sent over it.
    enabled: false
    provider: meta_cloud_api           # meta_cloud_api | twilio
    meta_cloud_api:
      phone_number_id_env: AZMONITOR_WHATSAPP_PHONE_NUMBER_ID
      access_token_env: AZMONITOR_WHATSAPP_TOKEN
      endpoint: "https://graph.facebook.com/v21.0"
      timeout_seconds: 30
    twilio:
      account_sid_env: AZMONITOR_TWILIO_ACCOUNT_SID
      auth_token_env: AZMONITOR_TWILIO_AUTH_TOKEN
      from_env: AZMONITOR_TWILIO_WHATSAPP_FROM
      endpoint: "https://api.twilio.com/2010-04-01"
      timeout_seconds: 30
    # Templates must be approved by the provider before they can be sent. The names below are what
    # this code asks for; register them with exactly these variables, in this order.
    templates:
      report_ready:
        name: azmonitor_report_ready
        language: en
        # {{1}} report name, {{2}} edition, {{3}} where to read it
        variables: [report_name, edition, location_hint]
      alert:
        name: azmonitor_alert
        language: en
        # {{1}} severity, {{2}} what happened
        variables: [severity, headline]
    # Only recipients whose opt-in is recorded above receive anything, whatever the environment says.
    require_recorded_opt_in: true

# ------------------------------------------------------------------- retry rules
retry:
  # A provider call has three outcomes, not two. Confirmed failure may be retried; a confirmed send
  # never is; and an ambiguous answer - a timeout, a dropped connection, a 5xx after the request was
  # accepted - is left for a person, because retrying it is how a board gets the same report twice.
  max_attempts: 3
  backoff_seconds: [30, 300]
  retry_on_status: [408, 429, 500, 502, 503, 504]
  # An attempt that got this far without a clear answer is marked needs_review and never auto-sent.
  ambiguous_marks_for_review: true
  # A delivery that has been pending longer than this is reported as stuck.
  stale_after_minutes: 120

# --------------------------------------------------------------- narrative by API
# The deterministic and analyst paths need none of this. It applies only when
# settings.narrative.provider is set to "api", and the run refuses to start if a limit is missing.
ai_narrative:
  enabled: false
  provider: anthropic
  model_env: AZMONITOR_NARRATIVE_MODEL          # exact model id, from the environment
  api_key_env: ANTHROPIC_API_KEY
  limits:
    max_tokens_per_call: 4000
    max_calls_per_run: 2
    max_calls_per_day: 8
    # Hard ceiling in USD. The run tracks what it has spent in data/state/ai_spend.json and stops
    # when either limit is reached, falling back to the facts-only narrative and saying so.
    max_usd_per_day: 5.00
    max_usd_per_month: 50.00
    # Prices are the caller's responsibility to keep current; they are only used to enforce the
    # ceiling above and are never presented as a bill.
    usd_per_million_input_tokens_env: AZMONITOR_NARRATIVE_INPUT_PRICE
    usd_per_million_output_tokens_env: AZMONITOR_NARRATIVE_OUTPUT_PRICE
  on_limit_reached: fall_back_to_facts_only     # fall_back_to_facts_only | block_edition
