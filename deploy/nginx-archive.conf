# Read-only access to the report archive, so a link in a delivered email resolves to the file.
#
# Deliberately minimal and deliberately not public: it listens on localhost, serves only the outputs
# directory, and never the dataset. Put the host's own reverse proxy and authentication in front of
# it before setting AZMONITOR_ARCHIVE_BASE_URL to anything reachable.

server {
    listen 80;
    server_name _;

    # Only the produced reports. The dataset, the raw downloads and the delivery ledger sit in the
    # same volume and must not be served: an alias rather than a root is what keeps them out.
    location /outputs/ {
        alias /usr/share/nginx/html/outputs/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # An edition is immutable once written, so it can be cached hard; `latest` is a pointer and
        # must not be.
        location ~* /outputs/latest/ {
            alias /usr/share/nginx/html/outputs/latest/;
            add_header Cache-Control "no-store";
        }
        add_header Cache-Control "private, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
