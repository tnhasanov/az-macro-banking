# One image, one dataset, several scheduled tasks.
#
# There is no long-running service here on purpose. Each task is a container that starts, does one
# thing and exits, which means a crash cannot leave a half-written dataset behind a healthy-looking
# process, and the systemd timers stay the single source of truth about when anything happens.
#
#   docker compose run --rm source-check     # what the 09:15 / 13:15 / 17:15 timers invoke
#   docker compose run --rm weekly-digest    # what the Monday 08:30 timer invokes
#   docker compose run --rm monitor          # health: missed runs, quiet sources, stuck deliveries
#   docker compose run --rm cli schedule status
#
# State lives in one named volume. Back that volume up and the system is recoverable; lose it and
# the dataset can be rebuilt from the sources, but the record of what has already been sent to
# people cannot - which is why deliveries.sqlite lives there too.

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: azmonitor:latest
  env_file:
    - ../.env                      # never committed; see deploy/env.example
  environment:
    TZ: Asia/Baku
    AZMONITOR_DATA_DIR: /var/lib/azmonitor/data
    AZMONITOR_OUTPUT_DIR: /var/lib/azmonitor/outputs
  volumes:
    - azmonitor-state:/var/lib/azmonitor
  # The container needs to reach the CBA and SSC, and Microsoft Graph when delivery is on. It needs
  # nothing else and accepts no inbound connection.
  networks: [default]
  restart: "no"
  stop_grace_period: 30s
  # A run that hangs on a slow download should be killed by the timer, not linger for hours.
  deploy:
    resources:
      limits:
        memory: 2g
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
  security_opt:
    - no-new-privileges:true

services:

  source-check:
    <<: *common
    command: ["run-task", "--task", "source-check"]

  weekly-digest:
    <<: *common
    command: ["run-task", "--task", "weekly-digest"]

  monitor:
    <<: *common
    command: ["run-task", "--task", "monitor"]

  # Anything ad hoc: `docker compose run --rm cli delivery status`, `... backfill --start 2020-01`.
  cli:
    <<: *common
    command: ["schedule", "status"]

  # Serves the report archive read-only, so the links in a delivered email resolve. Bound to
  # localhost by default: put it behind the reverse proxy and authentication the host already has,
  # and set AZMONITOR_ARCHIVE_BASE_URL to the address it ends up on. Leave it out entirely and the
  # emails carry the attachment and simply name the other files.
  archive:
    image: nginx:alpine
    profiles: [archive]
    volumes:
      - azmonitor-state:/usr/share/nginx/html:ro
      - ./nginx-archive.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    networks: [default]

volumes:
  azmonitor-state:
    name: azmonitor-state

networks:
  default:
    name: azmonitor
