name: checks

# The checks that matter for this repository are the ones that would let a wrong number reach a
# board pack: grounding, publication handling, the rules that decide when an edition is published,
# and the operational guards. They all run on fixtures and temporary databases, so the workflow
# needs no network access and no credentials.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job, publication and notification rules live in Postgres (partial unique indexes, row
    # locks, SQL functions), so they are tested against Postgres, not a stand-in.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azmon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AZMONITOR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azmon_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cloud]"

      - name: Configuration loads and every configured parser exists
        run: |
          python - <<'PY'
          from azmonitor import config
          from azmonitor.parsers.registry import get_parser
          n = 0
          for source_id, source, ds in config.iter_datasets():
              assert ds.get("id"), f"dataset without an id in {source_id}"
              get_parser(ds.get("parser"))          # raises on an unknown parser id
              n += 1
          for loader in (config.settings, config.sources, config.metrics_config, config.reports_config,
                         config.theme, config.glossary):
              assert loader(), f"{loader.__name__} returned nothing"
          print(f"{n} datasets configured, all parsers resolve")
          PY

      - name: Every metric input resolves to a configured series or another metric
        run: |
          python - <<'PY'
          from azmonitor import config

          series = set()
          for _source_id, _source, ds in config.iter_datasets():
              parse = ds.get("parse") or {}
              for row in (parse.get("series") or []) + (parse.get("rows") or []):
                  series.add(row["id"])
          generated = tuple(config.sources().get("generated_series_prefixes") or ())
          assert generated, "generated_series_prefixes must be configured"

          metrics = config.metrics_config()["metrics"]
          known = series | {m["id"] for m in metrics}
          missing = {}
          for m in metrics:
              inputs = [m.get("input"), m.get("numerator"), m.get("denominator")]
              inputs += list(m.get("inputs") or []) + list(m.get("numerators") or [])
              for ref in [x for x in inputs if x]:
                  if ref not in known and not ref.startswith(generated):
                      missing.setdefault(m["id"], []).append(ref)
          assert not missing, f"metric inputs that resolve to nothing: {missing}"
          print(f"{len(metrics)} metrics, every input resolves to a configured or generated series")
          PY

      - name: Grounding, publications, operations, scheduling and delivery
        run: python -m pytest -q

      - name: The timers still match the schedule they are supposed to implement
        run: |
          python - <<'PY'
          from azmonitor.scheduling.tasks import schedule_drift
          problems = schedule_drift()
          assert not problems, "config/schedule.yaml and deploy/systemd disagree:\n  " + "\n  ".join(problems)
          print("config/schedule.yaml and the systemd timers are in step")
          PY

      - name: Delivery is off, and nothing in the committed configuration is a secret
        run: |
          python - <<'PY'
          import re
          from azmonitor import config

          d = config.delivery_config()
          assert d.get("enabled") is False, "delivery must be disabled in the committed configuration"
          # Every channel, not a named one. This check used to name WhatsApp alone, and `email:
          # enabled: true` sat in the committed configuration for weeks without CI objecting —
          # caught in the end by the workflow's own refusal to start, which is a slower place to
          # find it and one that only a dispatched run reaches.
          on = [name for name, ch in (d.get("channels") or {}).items() if ch.get("enabled")]
          assert not on, f"these channels are enabled in the committed configuration: {on}"

          # Every recipient is named by an environment variable, never by an address, and every
          # credential is a variable name. A literal address or token here would be committed.
          blob = str(d)
          for pattern, what in [(r"[\w.+-]+@[\w-]+\.[\w.]+", "an email address"),
                                (r"\+\d{7,}", "a phone number"),
                                (r"(?i)(secret|token|password)\s*[:=]\s*['\"]?[A-Za-z0-9/_+-]{12,}", "a credential")]:
              found = [m for m in re.findall(pattern, blob) if not m.endswith("example.az")]
              assert not found, f"config/delivery.yaml appears to contain {what}: {found[:3]}"

          for lst in d["distribution_lists"].values():
              for r in lst.get("recipients") or []:
                  assert r.get("email_env") or r.get("whatsapp_env"), \
                      f"recipient {r.get('id')} has no environment variable for its address"
          print("delivery is disabled; every recipient and credential is an environment variable name")
          PY

      - name: A facts-only narrative grounds every number it writes
        run: |
          python - <<'PY'
          import json, pathlib
          from azmonitor.narrative import facts_only
          from azmonitor.narrative.validate import validate_narrative
          fp = json.loads(pathlib.Path("tests/fixtures/fact_pack_min.json").read_text())
          nar = facts_only.generate(fp)
          result = validate_narrative(nar, fp, {})
          assert result["ok"], result["problems"]
          print(f"{result['numbers_checked']} numbers checked, no problems")
          PY

  render:
    # The deck is rendered on a machine with LibreOffice so a layout or chart regression is caught
    # before it reaches a report, without needing any source data.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-open-sans
      - name: Render a deck from the fixture fact pack and convert it
        run: |
          python - <<'PY'
          import json, pathlib, tempfile
          from azmonitor import config
          from azmonitor.narrative import facts_only
          from azmonitor.render.monthly import render_monthly
          from azmonitor.render.pdf import convert_to_pdf, soffice_available
          fp = json.loads(pathlib.Path("tests/fixtures/fact_pack_min.json").read_text())
          nar = facts_only.generate(fp)
          out = pathlib.Path(tempfile.mkdtemp())
          info = render_monthly(fp, nar, out / "deck.pptx", "en")
          assert info["n_slides"] >= 10, info
          assert soffice_available(), "LibreOffice is required for the PDF check"
          pdf = convert_to_pdf(out / "deck.pptx", out)
          assert pdf.exists() and pdf.stat().st_size > 50_000
          print(f"rendered {info['n_slides']} slides and converted to PDF")
          PY
      - name: Lay out the one-page infographic in Chromium with the report font
        run: python -m pytest -q tests/test_onepager.py

  blob-client:
    # Conformance, not integration: undici's MockAgent answers the requests, so only the transport
    # is substituted and every request is still built by the real @vercel/blob. It exists because
    # reading the SDK found two defects no test against our own abstraction could have — multipart
    # is opt-in and we were not passing it, and BlobNotFoundError does not set `.name`, so the
    # existence check never matched and the first upload of every edition would have failed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/blob/package-lock.json
      - run: npm ci --prefix tools/blob
      - run: npm test --prefix tools/blob

  web:
    # The dashboard: types, the request rules shared with the worker, the job and email ledgers
    # against Postgres, the routes' authentication and CSRF checks, and a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azmon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AZMONITOR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azmon_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

  windows-seed:
    # The bootstrap upload is run by hand on the owner's Windows machine, so the procedure is
    # rehearsed on one, under Windows PowerShell 5.1, against a stand-in bundle carrying the real
    # bundle's exact file names (scripts/windows/rehearsal_bundle.py; the real dataset is never
    # committed or published). The script seeds a local store once and refuses the second time; a
    # damaged part is refused before anything is installed; and the command the script runs after
    # its token prompt is run with the rehearsal token — Python starting Node, the helper, the SDK
    # building every request — against tools/blob/fake-store.mjs, then restored on a clean
    # directory. That last is this machine's side only; it proves nothing about Vercel.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      VERCEL_BLOB_RETRIES: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: What this runner has
        run: |
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          git --version
          py -3 --version
          python --version
          node --version

      - name: The Blob helper's tests, on Windows
        working-directory: tools/blob
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          node --test conformance.test.mjs oidc-from-env-file.test.mjs vercel-oidc.test.mjs helper-get.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "the Blob helper's tests failed on Windows" }

      - name: The storage tests, on Windows
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[dev,cloud]"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          python -m pytest -q tests/test_cloud_persistence.py
          if ($LASTEXITCODE -ne 0) { throw "the storage tests failed on Windows" }

      - name: A stand-in bundle under the real file names
        run: |
          python scripts\windows\rehearsal_bundle.py "$env:RUNNER_TEMP\downloads"
          if ($LASTEXITCODE -ne 0) { throw "could not build the stand-in bundle" }

      - name: The script seeds an empty store, then refuses to seed it again
        run: |
          $store = "$env:RUNNER_TEMP\store"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\seed-from-bundle.ps1 -Downloads "$env:RUNNER_TEMP\downloads" -RehearsalStoreDir $store
          if ($LASTEXITCODE -ne 0) { throw "the first seed exited $LASTEXITCODE; expected 0" }
          if (-not (Test-Path "$store\dataset\current.json")) { throw "the store holds no dataset pointer" }
          if (-not (Get-ChildItem "$store\dataset\backups\*-bootstrap.json")) { throw "no bootstrap backup was recorded" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\seed-from-bundle.ps1 -Downloads "$env:RUNNER_TEMP\downloads" -RehearsalStoreDir $store
          if ($LASTEXITCODE -ne 4) { throw "the second seed exited $LASTEXITCODE; expected 4 (already holds a dataset)" }
          exit 0

      - name: A damaged part is refused before anything is installed or written
        run: |
          $bad = "$env:RUNNER_TEMP\downloads-damaged"
          Copy-Item "$env:RUNNER_TEMP\downloads" $bad -Recurse
          $part = "$bad\raw-20260920T093543Z-snapshot.tar.gz.part-04"
          $bytes = [System.IO.File]::ReadAllBytes($part)
          $bytes[1000] = $bytes[1000] -bxor 0xFF
          [System.IO.File]::WriteAllBytes($part, $bytes)
          $store = "$env:RUNNER_TEMP\store-untouched"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\seed-from-bundle.ps1 -Downloads $bad -RehearsalStoreDir $store
          if ($LASTEXITCODE -ne 1) { throw "a damaged part exited $LASTEXITCODE; expected 1" }
          if (Test-Path $store) { throw "the store was created despite a damaged part" }
          exit 0

      - name: The token prompt's conversion and check
        run: |
          # The prompt itself needs a keyboard; what follows it is what can go wrong on 5.1.
          $secure = ConvertTo-SecureString "vercel_blob_rw_rehearsal_windowsci" -AsPlainText -Force
          $plain = [System.Net.NetworkCredential]::new("", $secure).Password
          if ($plain -ne "vercel_blob_rw_rehearsal_windowsci") { throw "SecureString conversion changed the value" }
          if ($plain -notmatch '^vercel_blob_rw_[A-Za-z0-9]+_[A-Za-z0-9]+$') { throw "the token check rejects a valid shape" }
          if ("not-a-token" -match '^vercel_blob_rw_[A-Za-z0-9]+_[A-Za-z0-9]+$') { throw "the token check accepts anything" }

      - name: The upload path end to end, against the stand-in Blob service
        env:
          AZMONITOR_FAKE_BLOB_DIR: ${{ runner.temp }}\fake-blob
        run: |
          # Exactly what the script runs after its prompt, with the rehearsal token, from the .venv
          # the script created. The seeded local store is itself a bundle in the same layout.
          $env:NODE_OPTIONS = "--import=" + ([System.Uri](Resolve-Path .\tools\blob\fake-store.mjs).Path).AbsoluteUri
          $env:BLOB_READ_WRITE_TOKEN = "vercel_blob_rw_rehearsal_windowsci"
          $env:AZMONITOR_BLOB_AUTH = "read-write"
          $env:AZMONITOR_PROFILE = "neutral"
          $py = ".\.venv\Scripts\python.exe"
          & $py -m azmonitor.cloud.publish seed --from-bundle "$env:RUNNER_TEMP\store"
          if ($LASTEXITCODE -ne 0) { throw "the seed through the helper exited $LASTEXITCODE; expected 0" }
          & $py -m azmonitor.cloud.publish seed --from-bundle "$env:RUNNER_TEMP\store"
          if ($LASTEXITCODE -ne 4) { throw "the second seed through the helper exited $LASTEXITCODE; expected 4" }

          # A clean directory restores what arrived, and the recorded backup restores intact.
          $env:AZMONITOR_DATA_DIR = "$env:RUNNER_TEMP\fresh-restore"
          & $py -m azmonitor.cloud.publish restore
          if ($LASTEXITCODE -ne 0) { throw "a fresh restore from the stand-in service failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\fresh-restore\monitor.sqlite")) { throw "the restore produced no database" }
          $backup = Get-ChildItem "$env:AZMONITOR_FAKE_BLOB_DIR\objects" |
            Where-Object { $_.Name -like "dataset%2Fbackups%2F*-bootstrap.json" } | Select-Object -First 1
          if (-not $backup) { throw "no bootstrap backup reached the stand-in service" }
          & $py -m azmonitor.cloud.publish backup --verify ([uri]::UnescapeDataString($backup.Name))
          if ($LASTEXITCODE -ne 0) { throw "the bootstrap backup did not restore intact" }
          exit 0
