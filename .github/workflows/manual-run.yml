name: manual run

# Running the reporting worker by hand, without switching the schedule on.
#
# GitHub will not let you dispatch a workflow that only exists on a side branch. A workflow file is
# registered from the default branch: until it is there, it has no id, it does not appear in the
# Actions list, and `POST /actions/workflows/{id}/dispatches` has nothing to resolve. Confirmed
# against this repository — the API lists `checks.yml` and nothing else, while `scheduled.yml` sits
# on claude/vercel-deployment and is invisible.
#
# That creates the problem this file solves. The obvious fix — put `scheduled.yml` on the default
# branch — also switches on its `schedule:` triggers, because those fire from the default branch and
# nowhere else. Merging to get a button would start unattended operation as a side effect.
#
# So this is a separate, manual-only workflow. It has no `schedule:` block and never will, so its
# presence on the default branch cannot start anything. It checks out whichever branch you name and
# runs that branch's engine, which means the cloud worker can be exercised end to end while
# `scheduled.yml` stays unmerged and dormant.
#
# Delete it once scheduled.yml is merged and running. It is scaffolding, not architecture.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to run (the engine comes from here, not from the default branch)"
        required: true
        default: claude/vercel-deployment
      task:
        description: "Which task to run"
        required: true
        type: choice
        options: [source-check, weekly-digest, monitor]
        default: source-check
      dry_run:
        description: "Decide everything, produce and send nothing"
        type: boolean
        default: true
      seed:
        description: "Instead of a task: check what a dataset seed would upload (uploads nothing)"
        type: boolean
        default: false

# One run at a time, shared with the scheduled workflow, so a manual run cannot overlap a scheduled
# one once both exist. The engine's database lease would catch it anyway; this keeps the history
# readable.
concurrency:
  group: azmonitor-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Baku
      AZMONITOR_PROFILE: neutral
      AZMONITOR_DATA_DIR: ${{ github.workspace }}/.state/data
      AZMONITOR_OUTPUT_DIR: ${{ github.workspace }}/.state/outputs
      AZMONITOR_RESTORE_CMD: python -m azmonitor.cloud.publish restore
      AZMONITOR_SAVE_CMD: python -m azmonitor.cloud.publish save
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # Used only to mint a short-lived Blob credential when no read-write token exists. Pinned,
      # so a new CLI release cannot change how a run authenticates without a commit saying so.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "59.23.2"
      AZMONITOR_DATABASE_URL: ${{ secrets.AZMONITOR_DATABASE_URL }}
      AZMONITOR_ARCHIVE_BASE_URL: ${{ secrets.AZMONITOR_ARCHIVE_BASE_URL }}
      AZMONITOR_OWNER_EMAIL: ${{ secrets.AZMONITOR_OWNER_EMAIL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/blob/package-lock.json

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress poppler-utils fonts-open-sans fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cloud]"
          npm ci --omit=dev --prefix tools/blob

      - name: Refuse to run if anything would leave the building
        run: |
          # This workflow exists for testing, so the two switches that could send something to a
          # person are checked rather than assumed. Either being on is a stop, not a warning.
          python - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("config/delivery.yaml", encoding="utf-8"))
          problems = []
          if cfg.get("enabled"):
              problems.append("config/delivery.yaml has enabled: true")
          for name, channel in (cfg.get("channels") or {}).items():
              if channel.get("enabled"):
                  problems.append(f"channel {name} is enabled")
          if problems:
              print("::error::this workflow will not run while delivery is on: "
                    + "; ".join(problems))
              sys.exit(1)
          print("delivery is disabled; nothing this run produces can reach anyone")
          PY

      - name: Confirm the distribution profile
        run: |
          # The neutral profile is what keeps the bank's logo, palette and name out of anything
          # uploaded to personal storage. `publish save` refuses under any other profile, but
          # failing here says why rather than failing later with a storage error.
          python -c "
          from azmonitor import config
          p = config.profile()
          print(f'profile: {p[\"name\"]}, external upload permitted: {p[\"external_upload\"]}')
          assert p['external_upload'], f'{p[\"name\"]} may not upload; set AZMONITOR_PROFILE=neutral'
          "

      - name: Mint a short-lived Blob credential
        # Only when no read-write token is configured. On a store connected to a Vercel project
        # that is the normal case rather than a misconfiguration: Vercel keeps the read-write token
        # as a sensitive variable, and a sensitive variable is write-only by design — no reveal in
        # the dashboard, no API that returns it — so it cannot be copied into a GitHub secret at
        # all. What can be had is the other credential. `vercel env pull` writes a fresh
        # VERCEL_OIDC_TOKEN, good for about twelve hours, beside the BLOB_STORE_ID it belongs to.
        #
        # The pulled file holds every non-sensitive variable in that environment, so it is read and
        # deleted inside this step: nothing else from it travels on, and the token is masked before
        # it can reach a log.
        if: ${{ !env.BLOB_READ_WRITE_TOKEN && env.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          pulled="$RUNNER_TEMP/.env.pulled"
          log="$RUNNER_TEMP/vercel-pull.log"
          trap 'rm -f "$pulled" "$log"' EXIT

          # Preview first, because that is the environment this deployment lives in. Development is
          # tried second because it is what Vercel's own local-development flow pulls, and a store
          # may be connected there instead.
          for target in preview development; do
            if npx --yes "vercel@$VERCEL_CLI_VERSION" env pull "$pulled" \
                 --environment="$target" --token="$VERCEL_TOKEN" --yes >"$log" 2>&1; then
              # The extractor says for itself which variable was missing, if one was.
              if node tools/blob/oidc-from-env-file.mjs "$pulled"; then
                echo "credential minted from the $target environment"
                exit 0
              fi
            else
              # `env pull` reports the names of variables, never their values, so the log is safe
              # to show — and the first run of this needs a reason more than it needs quiet.
              echo "pulling the $target environment failed:"
              tail -n 20 "$log" || true
            fi
            rm -f "$pulled"
          done
          echo "::error::could not mint a Blob credential. Check that the Blob store is connected" \
               "to this project, and that VERCEL_TOKEN is scoped to it and has not expired."
          exit 1

      - name: Prove the Blob credential before anything writes
        run: |
          # A wrong credential fails on the first call either way. What this catches is the run that
          # gets far enough to matter first: restore the dataset, spend ten minutes refreshing
          # sources and rendering, and only then discover it cannot save. One listing, no writes.
          python -m azmonitor.cloud.publish check

      - name: What a seed would upload
        if: inputs.seed
        run: python -m azmonitor.cloud.publish seed --check

      - name: Take the run lease
        if: ${{ !inputs.seed }}
        id: lease
        run: |
          python - <<'PY'
          import os, sys
          from azmonitor.cloud import lock as L, readmodel as RM
          if not os.environ.get("AZMONITOR_DATABASE_URL"):
              print("no database configured; relying on the workflow concurrency group alone")
              sys.exit(0)
          conn = RM.connect()
          RM.ensure_schema(conn)
          lease = L.DatabaseLease(conn, "azmonitor-run", minutes=55,
                                  detail={"task": os.environ.get("TASK", ""), "manual": True})
          try:
              info = lease.try_acquire()
              print(f"lease held by {info['holder']} until {info['expires_at']} "
                    f"(fence {info['fence']})")
              with open(os.environ["GITHUB_ENV"], "a") as fh:
                  fh.write(f"AZMONITOR_LEASE_HOLDER={info['holder']}\n")
                  fh.write(f"AZMONITOR_LEASE_FENCE={info['fence']}\n")
          except L.LeaseNotAcquired as exc:
              print(f"::notice::{exc}")
              sys.exit(75)
          finally:
              conn.close()
          PY
        env:
          TASK: ${{ inputs.task }}
        continue-on-error: true

      - name: Run the task
        if: ${{ !inputs.seed && steps.lease.outcome == 'success' }}
        id: run
        run: |
          set +e
          python -m azmonitor.cli run-task --task "${{ inputs.task }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Same gate as the scheduled workflow: only a complete, saved dataset may publish.
          case "$code" in
            0|2) echo "publish=yes" >> "$GITHUB_OUTPUT" ;;
            *)   echo "publish=no"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish what the dashboard reads
        if: ${{ !inputs.seed && steps.run.outputs.publish == 'yes' && !inputs.dry_run }}
        run: |
          if [ -n "$AZMONITOR_DATABASE_URL" ]; then
            python -m azmonitor.cloud.publish readmodel
            python -m azmonitor.cloud.publish record-run --task "${{ inputs.task }}" \
              --trigger manual --run-id "${{ github.run_id }}.${{ github.run_attempt }}" --published
            python -m azmonitor.cloud.publish verify
          fi

      - name: Release the lease
        if: ${{ always() && !inputs.seed && steps.lease.outcome == 'success' }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("AZMONITOR_DATABASE_URL"):
              raise SystemExit(0)
          from azmonitor.cloud import lock as L, readmodel as RM
          conn = RM.connect()
          try:
              L.DatabaseLease(conn, "azmonitor-run",
                              holder=os.environ.get("AZMONITOR_LEASE_HOLDER") or L.holder_id(),
                              fence=int(os.environ["AZMONITOR_LEASE_FENCE"])
                              if os.environ.get("AZMONITOR_LEASE_FENCE") else None).release()
          finally:
              conn.close()
          PY

      - name: What the store and the read model now hold
        if: ${{ always() && !inputs.seed }}
        run: python -m azmonitor.cloud.publish status || true

      - name: Fail the job if the run failed
        if: ${{ always() && !inputs.seed }}
        run: |
          if [ "${{ steps.lease.outcome }}" != "success" ]; then
            echo "another run holds the lease; nothing to do"; exit 0
          fi
          case "${{ steps.run.outputs.exit_code }}" in
            0|2|4) exit 0 ;;
            "") echo "::error::the task step did not run to completion"; exit 1 ;;
            *) echo "::error::run-task exited ${{ steps.run.outputs.exit_code }}"; exit 1 ;;
          esac
